{% load humanize %}
<tr id="pending-lead-row-{{ lead.id }}">
    <td colspan="6">
        <form hx-post="{% url 'confirm_website_order' lead_id=lead.id %}" 
              hx-target="#pending-lead-row-{{ lead.id }}" 
              hx-swap="outerHTML"
              class="p-3 bg-light rounded-3">
            {% csrf_token %}
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-semibold mb-1">Full Name</label>
                    <input type="text" name="name" class="form-control form-control-sm" value="{{ lead.name|default:'' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold mb-1">Email</label>
                    <input type="email" name="email" class="form-control form-control-sm" value="{{ lead.email|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold mb-1">Location</label>
                    <input type="text" name="address" class="form-control form-control-sm" placeholder="Address (lat, lng)" value="{% if lead.address %}{{ lead.address }}{% elif lead.latitude and lead.longitude %}({{ lead.latitude }}, {{ lead.longitude }}){% endif %}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold mb-1">Quantity</label>
                    <select name="quantity" class="form-select form-select-sm">
                        <option value="1" {% if lead.quantity == 1 %}selected{% endif %}>1</option>
                        <option value="3" {% if lead.quantity == 3 %}selected{% endif %}>3</option>
                        <option value="4" {% if lead.quantity == 4 %}selected{% endif %}>4</option>
                        <option value="5" {% if lead.quantity == 5 %}selected{% endif %}>5</option>
                        <option value="6" {% if lead.quantity == 6 %}selected{% endif %}>6</option>
                        <option value="8" {% if lead.quantity == 8 %}selected{% endif %}>8</option>
                        <option value="10" {% if lead.quantity == 10 %}selected{% endif %}>10</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold mb-1">Price (UGX)</label>
                    <input type="number" step="0.01" name="total" class="form-control form-control-sm" placeholder="0.00" value="{{ lead.total|default:'' }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold mb-1">Delivery Date</label>
                    <input type="date" name="delivery_time" class="form-control form-control-sm" value="{{ lead.delivery_time|default:'' }}">
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-success btn-sm flex-fill">Confirm</button>
                    <button type="button" class="btn btn-secondary btn-sm" 
                            hx-get="{% url 'staff_dashboard' %}" 
                            hx-target="#main-content" 
                            hx-swap="innerHTML">Cancel</button>
                </div>
            </div>
        </form>
    </td>
</tr>
